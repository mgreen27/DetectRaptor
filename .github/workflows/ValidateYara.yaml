name: Validate generated YARA

on:
  workflow_run:
    workflows:
      - Weekly yara file update
      - Weekly yara process update
      - Weekly webshell update
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: master

    - name: Download Velociraptor binaries
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
          set -euo pipefail
          RELEASE="$(gh api repos/Velocidex/velociraptor/releases/latest)"
          VERSION="$(jq -er '.tag_name' <<< "$RELEASE")"
          LINUX="$(
            jq -er '
              [.assets[] | select(.name | test("-linux-amd64-musl(\\.gz)?$"))]
              | if length == 1 then .[0].browser_download_url
                else error("Expected exactly one Linux amd64 musl binary asset")
                end
            ' <<< "$RELEASE"
          )"
          echo "VERSION=$VERSION"
          echo "LINUX=$LINUX"
          DOWNLOAD="$(mktemp)"
          trap 'rm -f "$DOWNLOAD"' EXIT
          curl --fail --silent --show-error --location --retry 3 "$LINUX" -o "$DOWNLOAD"
          if [[ "$LINUX" == *.gz ]]; then
            gzip -dc "$DOWNLOAD" > ./velociraptor
          else
            cp "$DOWNLOAD" ./velociraptor
          fi
          chmod +x ./velociraptor
          ./velociraptor version

    - name: Validate generated YARA bundles
      run: bash ./scripts/validate_yara_with_velociraptor.sh
